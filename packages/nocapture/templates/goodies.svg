      <circle cx="16.5" cy="16.5" r="1.3" fill="#2a2a28"/>
      <path d="M 12 18.5 L 14 18.5 L 13 19.5 Z" fill="#2a2a28"/>
      <!-- Whiskers -->
      <path d="M 6 17 L 1 16 M 6 19 L 1 20" stroke="#2a2a28" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 20 17 L 25 16 M 20 19 L 25 20" stroke="#2a2a28" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Coffee cup with steam -->
    <g id="nc-coffee">
