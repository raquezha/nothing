<svg xmlns="http://www.w3.org/2000/svg" style="display:none;" aria-hidden="true">
  <defs>
    <!-- Hand-drawn peeking cat mascot -->
    <g id="nc-cat">
      <path d="M 2 22 L 4 8 L 9 13 Q 13 11 17 13 L 22 8 L 24 22 Z" fill="#fdfdfc" stroke="#2a2a28" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="9.5" cy="16.5" r="1.3" fill="#2a2a28"/>
      <circle cx="16.5" cy="16.5" r="1.3" fill="#2a2a28"/>
      <path d="M 12 18.5 L 14 18.5 L 13 19.5 Z" fill="#2a2a28"/>
      <!-- Whiskers -->
      <path d="M 6 17 L 1 16 M 6 19 L 1 20" stroke="#2a2a28" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 20 17 L 25 16 M 20 19 L 25 20" stroke="#2a2a28" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Coffee cup with steam -->
    <g id="nc-coffee">
      <path d="M 4 14 L 18 14 L 17 26 Q 11 28 5 26 Z" fill="#ffffff" stroke="#2a2a28" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M 18 16 Q 24 16 24 20 Q 24 24 18 24" fill="none" stroke="#2a2a28" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M 8 10 Q 9 6 7 2 M 14 10 Q 15 6 13 2" fill="none" stroke="#73736f" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Hand-drawn sparkle / 4-point star -->
    <g id="nc-sparkle">
      <path d="M 12 0 C 12 6 13 11 18 12 C 13 13 12 18 12 24 C 12 18 11 13 6 12 C 11 11 12 6 12 0 Z" fill="#febc2e" stroke="#2a2a28" stroke-width="1.4" stroke-linejoin="round"/>
    </g>

    <!-- Hand-drawn curved arrow -->
    <g id="nc-arrow">
      <path d="M 2 24 C 14 8 38 4 60 14 C 68 18 74 24 78 30" fill="none" stroke="#2a2a28" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 66 28 L 79 31 L 81 18" fill="none" stroke="#2a2a28" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Hand-drawn dashed curved connector -->
    <g id="nc-arrow-dashed">
      <path d="M 2 4 C 16 18 36 28 58 24 C 68 22 76 16 80 8" fill="none" stroke="#2a2a28" stroke-width="1.6" stroke-dasharray="4 3" stroke-linecap="round"/>
      <path d="M 72 10 L 81 7 L 80 17" fill="none" stroke="#2a2a28" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Dizzy spiral doodle -->
    <g id="nc-spiral">
      <path d="M 12 16 C 14 12, 19 14, 17 18 C 15 22, 8 18, 11 12 C 14 6, 23 9, 21 17 C 20 23, 10 24, 7 19" fill="none" stroke="#9a5b4a" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Sketchbook shapes -->
    <g id="nc-heart">
      <path d="M 12 18 C 6 11 5 4 10 4 C 13 4 15 6 16 8 C 17 6 19 4 22 4 C 27 4 26 11 20 18 Z" fill="#f5cdbf" stroke="#2a2a28" stroke-width="1.4" stroke-linejoin="round"/>
    </g>
    <g id="nc-diamond">
      <polygon points="12,2 22,12 12,22 2,12" fill="#bde8cf" stroke="#2a2a28" stroke-width="1.4" stroke-linejoin="round"/>
    </g>
    <g id="nc-circle">
      <circle cx="12" cy="12" r="9" fill="#bfddf0" stroke="#2a2a28" stroke-width="1.4"/>
    </g>

    <!-- Brush underline -->
    <g id="nc-brush">
      <path d="M 2 8 Q 80 2 160 6 Q 100 11 2 8 Z" fill="currentColor"/>
    </g>
  </defs>
</svg>
