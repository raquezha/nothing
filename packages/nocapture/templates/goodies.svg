      <path d="M 2 24 C 14 8 38 4 60 14 C 68 18 74 24 78 30" fill="none" stroke="#2a2a28" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 66 28 L 79 31 L 81 18" fill="none" stroke="#2a2a28" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
