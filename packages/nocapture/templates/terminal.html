<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Terminal Template</title>
  <style>
    :root {
      --nc-bg: #0f172a;
      --nc-term-bg: #1e293b;
      --nc-fg: #f8fafc;
      --nc-muted: #94a3b8;
      --nc-prompt: #38bdf8;
      --nc-command: #facc15;
      --nc-border: #334155;
      --nc-font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--nc-bg);
      color: var(--nc-fg);
      font-family: var(--nc-font);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #capture {
      width: 1200px;
      height: 675px;
      padding: 48px;
      background: radial-gradient(circle at 50% 30%, #1e293b, #0f172a);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .window {
      width: 960px;
      background: var(--nc-term-bg);
      border: 1px solid var(--nc-border);
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      position: relative;
      z-index: 2;
    }

    .titlebar {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      background: #0f172a;
      border-bottom: 1px solid var(--nc-border);
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot-close { background: #ef4444; }
    .dot-minimize { background: #f59e0b; }
    .dot-maximize { background: #10b981; }

    .window-title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      color: var(--nc-muted);
      margin-right: 48px;
    }

    .terminal-body {
      padding: 24px;
      font-size: 16px;
      line-height: 1.7;
      min-height: 320px;
    }

    .line {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .prompt {
      color: var(--nc-prompt);
      font-weight: 700;
    }

    .command {
      color: var(--nc-command);
      font-weight: 600;
    }

    .output {
      color: var(--nc-muted);
      margin-left: 20px;
      white-space: pre-wrap;
    }

    .success {
      color: #4ade80;
    }

    .mascot {
      position: absolute;
      top: 24px;
      right: 40px;
      width: 48px;
      height: 48px;
      color: #475569;
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
    <defs>
      <g id="nc-cat">
        <path d="M 6 34 C 4 20 8 10 16 10 C 20 10 24 16 26 20 C 30 14 36 10 40 10 C 48 10 52 20 50 34 C 48 44 40 48 28 48 C 16 48 8 44 6 34 Z" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M 12 12 L 10 3 L 20 9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 44 12 L 46 3 L 36 9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="20" cy="24" r="2.5" fill="currentColor"/>
        <circle cx="36" cy="24" r="2.5" fill="currentColor"/>
        <path d="M 28 28 L 26 31 L 30 31 Z" fill="currentColor"/>
      </g>
    </defs>
  </svg>

  <div id="capture">
    <div class="mascot" data-start="0" data-persist>
      <svg width="48" height="48" viewBox="0 0 56 56"><use href="#nc-cat"/></svg>
    </div>

    <div class="window" data-start="0" data-enter="zoom" data-persist>
      <div class="titlebar">
        <div class="dot dot-close"></div>
        <div class="dot dot-minimize"></div>
        <div class="dot dot-maximize"></div>
        <div class="window-title">bash — 960×420</div>
      </div>

      <div class="terminal-body">
        <div class="line" data-start="0.2" data-persist>
          <span class="prompt">raquezha@macmini:~/site$</span>
          <span class="command" data-start="0.4" data-type="npx nocapture init --template tutorial" data-type-duration="1.8" data-persist></span>
        </div>

        <div class="output" data-start="2.3" data-enter="fade" data-persist>
[nocapture] Scaffolding tutorial template...
✓ Created tutorial.html
✓ Inlined SVG goodies sprite
✓ Verified deterministic window.renderAt(seconds)</div>

        <div class="output success" data-start="2.8" data-enter="fade" data-persist>
Done! Run `nocapture video --scene tutorial.html` to render.</div>
      </div>
    </div>
  </div>

  <script>
    function clamp(val, min = 0, max = 1) { return Math.max(min, Math.min(max, val)); }
    function smoothstep(t) { const x = clamp(t, 0, 1); return x * x * (3 - 2 * x); }
    function applyTimeline(root, seconds) {
      const elements = root.querySelectorAll ? root.querySelectorAll("[data-start]") : [];
      for (const el of elements) {
        const start = parseFloat(el.getAttribute("data-start")) || 0;
        const hasDuration = el.hasAttribute("data-duration");
        const duration = hasDuration ? parseFloat(el.getAttribute("data-duration")) : Infinity;
        const persist = el.hasAttribute("data-persist");
        const end = start + duration;
        if (seconds < start || (seconds > end && !persist)) {
          el.style.opacity = "0";
          continue;
        }
        el.style.opacity = "1";
        const activeSec = seconds - start;
        const textToType = el.getAttribute("data-type");
        if (textToType !== null) {
          const typeDuration = parseFloat(el.getAttribute("data-type-duration")) || 1.5;
          const p = clamp(activeSec / typeDuration, 0, 1);
          const chars = Math.floor(p * textToType.length);
          el.innerHTML = textToType.slice(0, chars) + (p < 1 ? '<span style="opacity:1;">▍</span>' : '');
        }
      }
    }
    window.renderAt = function(seconds) {
      applyTimeline(document.body, seconds);
    };
  </script>
</body>
</html>
